[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-support-triage"
version = "0.1.0"
description = "Real-world customer support triage OpenEnv environment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenEnv Support Triage" }]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "openai>=2.7.2,<3.0.0",
  "python-dotenv==1.0.1",
  "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openenv_support_triage*"]
